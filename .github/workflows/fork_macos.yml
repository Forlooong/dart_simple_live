name: app-build-action-macos
run-name: "Release macOS · 1.12.7+11108 · #${{ github.run_number }}"

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'simple_live_app/**'
      - 'simple_live_core/**'
      - 'packages/**'
      - '.github/actions/**'
      - 'tool/**'
      - '.github/workflows/fork_macos.yml'

permissions:
  contents: read

concurrency:
  group: fork-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    env:
      # connectivity_plus uses APIs introduced in the Apple 26 SDKs.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    timeout-minutes: 60
    defaults:
      run:
        working-directory: simple_live_app
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check version and prepare build identity
        id: metadata
        run: python ../tool/version.py metadata main
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true
      - name: Set up Rust native targets
        uses: ./.github/actions/setup-native
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - name: Build console with native asset bundle
        working-directory: simple_live_console
        run: |
          dart pub get --enforce-lockfile
          dart build cli --target bin/simple_live_console.dart --output build/cli
          python ../tool/verify_native_bundle.py cli build/cli
      - name: Restore locked packages
        run: flutter pub get --enforce-lockfile
      - uses: ./.github/actions/check-native
      - name: Configure macOS release
        run: flutter build macos --release --no-pub --config-only
      - name: Build unsigned universal macOS app
        run: |
          xcodebuild -workspace macos/Runner.xcworkspace -scheme Runner \
            -configuration Release -derivedDataPath "$PWD/build/macos" \
            -destination 'generic/platform=macOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= \
            ARCHS='arm64 x86_64' ONLY_ACTIVE_ARCH=NO \
            COMPILER_INDEX_STORE_ENABLE=NO -quiet
      - name: Verify both native library architectures
        run: python ../tool/verify_native_bundle.py macos "build/macos/Build/Products/Release/Simple Live.app"
      - name: Package macOS app
        env:
          APP_VERSION: ${{ steps.metadata.outputs.artifact_version }}
        run: |
          set -euo pipefail
          app='build/macos/Build/Products/Release/Simple Live.app'
          test -d "$app"
          lipo "$app/Contents/MacOS/Simple Live" -verify_arch arm64 x86_64
          mkdir -p build/artifacts
          ditto -c -k --sequesterRsrc --keepParent "$app" "build/artifacts/Simple-Live-${APP_VERSION}-macOS-universal-Unsigned.zip"
          unzip -t build/artifacts/*.zip
          (cd build/artifacts && shasum -a 256 *.zip > SHA256SUMS.txt)
          printf '%s\n' "macOS $APP_VERSION · arm64 + x64 · unsigned ZIP" 'Not notarized; macOS may prevent opening this build.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload macOS package
        uses: actions/upload-artifact@v7
        with:
          name: Simple-Live-${{ steps.metadata.outputs.artifact_version }}-macOS-universal-Unsigned
          path: simple_live_app/build/artifacts/
          if-no-files-found: error
          retention-days: 14
