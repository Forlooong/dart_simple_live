name: app-build-action-linux
run-name: "Release Linux · 1.1.2"

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'simple_live_app/**'
      - 'simple_live_core/**'
      - '.github/workflows/fork_linux.yml'

permissions:
  contents: read

concurrency:
  group: fork-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: simple_live_app
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true
      - name: Read package version
        id: metadata
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version: *\([^ ]*\).*$/\1/p' pubspec.yaml | tr -d '\r')"
          package_version="$version"
          [[ "$package_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$ ]]
          version="${package_version%%+*}"
          # GitHub evaluates run-name before checkout. Fail if a version bump
          # forgot to update this workflow's static, version-only title.
          expected_title="Release Linux · $version"
          actual_title="$(sed -n 's/^run-name: "\(.*\)"$/\1/p' ../.github/workflows/fork_linux.yml)"
          if [[ "$actual_title" != "$expected_title" ]]; then
            echo "::error::Update run-name to $expected_title to match pubspec.yaml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          {
            printf '## Build identity\n\n'
            printf -- '- Package version: `%s`\n' "$package_version"
            printf -- '- CI build: `%s.%s`\n' "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_ATTEMPT"
            printf -- '- Commit: `%s`\n\n' "$GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Restore locked packages
        run: flutter pub get --enforce-lockfile
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libasound2-dev libmpv-dev mpv
      - name: Build Linux release
        run: flutter build linux --release --no-pub
      - name: Package Linux bundle
        env:
          APP_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          bundle=build/linux/x64/release/bundle
          test -x "$bundle/simple_live_app"
          mkdir -p build/artifacts
          tar -czf "build/artifacts/Simple-Live-${APP_VERSION}-Linux-x64.tar.gz" -C "$bundle" .
          tar -tzf build/artifacts/*.tar.gz > /dev/null
          (cd build/artifacts && sha256sum *.tar.gz > SHA256SUMS.txt)
          printf '%s\n' "Linux $APP_VERSION · x64 · release tar.gz" 'Extract the full bundle. Requires GTK 3 and libmpv runtime libraries (Ubuntu 22.04 or compatible).' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Linux package
        uses: actions/upload-artifact@v7
        with:
          name: Simple-Live-${{ steps.metadata.outputs.version }}-Linux-x64-Release
          path: simple_live_app/build/artifacts/
          if-no-files-found: error
          retention-days: 14
