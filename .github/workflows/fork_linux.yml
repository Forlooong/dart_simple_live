name: app-build-action-linux
run-name: "Release Linux · 1.12.7+11108 · #${{ github.run_number }}"

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'simple_live_app/**'
      - 'simple_live_core/**'
      - 'packages/**'
      - '.github/actions/**'
      - 'tool/**'
      - '.github/workflows/fork_linux.yml'

permissions:
  contents: read

concurrency:
  group: fork-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: simple_live_app
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check version and prepare build identity
        id: metadata
        run: python ../tool/version.py metadata main
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true
      - name: Set up Rust native targets
        uses: ./.github/actions/setup-native
      - name: Build console with native asset bundle
        working-directory: simple_live_console
        run: |
          dart pub get --enforce-lockfile
          dart build cli --target bin/simple_live_console.dart --output build/cli
          python ../tool/verify_native_bundle.py cli build/cli
      - name: Restore locked packages
        run: flutter pub get --enforce-lockfile
      - uses: ./.github/actions/check-native
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libasound2-dev libmpv-dev mpv
      - name: Build Linux release
        run: flutter build linux --release --no-pub
      - name: Load bundled native ABI
        run: python ../tool/verify_native_bundle.py linux build/linux/x64/release/bundle
      - name: Package Linux bundle
        env:
          APP_VERSION: ${{ steps.metadata.outputs.artifact_version }}
        run: |
          set -euo pipefail
          bundle=build/linux/x64/release/bundle
          test -x "$bundle/simple_live_app"
          mkdir -p build/artifacts
          tar -czf "build/artifacts/Simple-Live-${APP_VERSION}-Linux-x64.tar.gz" -C "$bundle" .
          tar -tzf build/artifacts/*.tar.gz > /dev/null
          (cd build/artifacts && sha256sum *.tar.gz > SHA256SUMS.txt)
          printf '%s\n' "Linux $APP_VERSION · x64 · release tar.gz" 'Extract the full bundle. Requires GTK 3 and libmpv runtime libraries (Ubuntu 22.04 or compatible).' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Linux package
        uses: actions/upload-artifact@v7
        with:
          name: Simple-Live-${{ steps.metadata.outputs.artifact_version }}-Linux-x64-Release
          path: simple_live_app/build/artifacts/
          if-no-files-found: error
          retention-days: 14
