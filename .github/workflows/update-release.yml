name: Prepare or publish update
on:
  push:
    branches: [master]
    paths: [.github/workflows/update-release.yml]
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful master Build installers run ID (all six platforms)
        required: true
        type: string
      publish:
        description: Publish publicly after reviewing source, licenses and artifacts
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: manual-update-release
  cancel-in-progress: false
jobs:
  release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Require this fork and master branch
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REF: ${{ github.ref }}
        run: |
          test "$EVENT_REPOSITORY" = Forlooong/dart_simple_live
          test "$EVENT_REF" = refs/heads/master
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Select immutable build source
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .head_sha)
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          git worktree add --detach "$RUNNER_TEMP/update-source" "$sha"
      - name: Prepare verified installers and update manifest (SDK metadata checked)
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          python -B tool/prepare_update_release.py "$RUN_ID" --output "$RUNNER_TEMP/update-release" \
            --source "$RUNNER_TEMP/update-source" \
            --apksigner "$apksigner" --aapt2 "$(dirname "$apksigner")/aapt2"
      - name: Upload reviewable release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: update-release-review
          path: |
            ${{ runner.temp }}/update-release/*
            ${{ runner.temp }}/release-notes.md
          retention-days: 14
      - name: Publish complete release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.prepare.outputs.tag }}
          SOURCE_SHA: ${{ steps.prepare.outputs.sha }}
        run: |
          # Never overwrite or silently replace an existing release/tag.
          if gh release view "$TAG" >/dev/null 2>&1 || git ls-remote --exit-code origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo 'This version already has a release or tag; refusing replacement.' >&2
            exit 1
          fi
          gh release create "$TAG" --target "$SOURCE_SHA" --draft \
            --title "${{ steps.prepare.outputs.title }}" --notes-file "$RUNNER_TEMP/release-notes.md"
          gh release upload "$TAG" "$RUNNER_TEMP/update-release/"*
          python -B tool/prepare_update_release.py --verify-tag "$TAG" --output "$RUNNER_TEMP/update-release"
          gh release edit "$TAG" --draft=false --latest
  edit-release-notes:
    if: >-
      github.repository == 'Forlooong/dart_simple_live' && github.event_name == 'push' && github.event.head_commit.message == 'docs: simplify published release notes'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Update release title and description
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: Forlooong/dart_simple_live
          RELEASE_BODY: |
            - 支持应用内检查更新、自动选择安装包、下载并打开安装器。
            - Android / TV 可使用相同签名的新版覆盖安装；桌面端下载对应安装包更新。
            - iOS IPA 需自行签名安装。

            基于 [Simple Live](https://github.com/xiaoyaocz/dart_simple_live)，由 Forlooong 维护。源码、GPLv3 许可证及第三方声明见附件。
        run: |
          gh release edit fork-main-1.12.23-build11124-tv-1.7.14-build10619 \
            --title 'Simple Live 1.12.23 / TV 1.7.14' --notes "$RELEASE_BODY"
