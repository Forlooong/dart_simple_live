            "Commit: $GITHUB_SHA" \
            "Signing: $SIGNING_MODE" \
            'Build mode: release' \
            'Package: com.xycz.simple_live_tv' \
            'Android TV: choose arm64, arm32 or x64 to match the device CPU and OS.' \
            'In-place updates require the same application ID, signing identity and ABI, with a higher version code.' \
