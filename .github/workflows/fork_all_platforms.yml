      - uses: ./.github/actions/check-native

      - name: Test TV danmaku batching and follow polling
        run: flutter test --no-pub test/danmaku_batch_test.dart test/follow_refresh_test.dart

      - name: Validate public signing baseline
        run: python ../tool/verify_apk_signer.py tv

      - name: Configure APK signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.TV_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.TV_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.TV_KEY_PASSWORD }}
