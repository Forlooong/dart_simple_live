name: app build action
run-name: "Build all platforms · Main 1.12.13+11114 · TV 1.7.4+10609 · #${{ github.run_number }}"

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-all-platforms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: simple_live_app
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check version and prepare build identity
        id: metadata
        run: python ../tool/version.py metadata main
      - name: Test version management
        run: python -B -m unittest discover -s ../tool -p test_version.py
      - name: Test installer identity and signing guards
        run: python -B -m unittest discover -s ../tool -p test_installer_identity.py
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true
      - name: Set up Rust native targets
        uses: ./.github/actions/setup-native
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Restore packages
        run: flutter pub get --enforce-lockfile
      - uses: ./.github/actions/check-native

      - name: Check player and notification code
        run: |
          flutter analyze --no-pub --no-fatal-infos \
            lib/modules/live_room/live_room_controller.dart \
            lib/modules/live_room/player/player_controller.dart \
            lib/modules/live_room/player/playback_diagnostics.dart \
            lib/modules/live_room/player/player_command_queue.dart \
            lib/routes/app_navigation.dart \
            lib/services/live_notification_service.dart \
            lib/services/live_notifications \
            lib/services/follow_import.dart \
            lib/services/follow_service.dart \
            lib/services/db_service.dart \
            lib/main.dart \
            lib/models/db/follow_user.dart \
            lib/modules/follow_user \
            lib/widgets/follow_user_item.dart

      - name: Test player lifecycle and live notifications
        run: >-
          flutter test --no-pub
          test/player_command_queue_test.dart
          test/live_room_lifecycle_test.dart
          test/live_playback_recovery_test.dart
          test/playback_diagnostics_test.dart
          test/danmaku_lifecycle_test.dart
          test/chat_message_buffer_test.dart
          test/danmaku_rule_validation_test.dart
          test/follow_refresh_test.dart
          test/db_follow_tag_test.dart
          test/follow_user_controller_test.dart
          test/follow_notification_preferences_test.dart
          test/live_status_validation_test.dart
          test/live_notification_runner_test.dart
          test/notification_navigation_test.dart
          test/live_notification_service_test.dart

      - name: Validate public signing baseline
        run: python ../tool/verify_apk_signer.py main

      - name: Configure APK signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          names = ('KEYSTORE_BASE64', 'STORE_PASSWORD', 'KEY_PASSWORD', 'KEY_ALIAS')
          present = [bool(os.environ.get(name)) for name in names]
          if any(present) and not all(present):
              raise SystemExit('Release signing secrets are incomplete; refusing to fall back silently.')

          if all(present):
              os.umask(0o077)
              keystore = Path(os.environ['RUNNER_TEMP']) / 'simple-live-release.jks'
              try:
                  keystore.write_bytes(base64.b64decode(
                      ''.join(os.environ['KEYSTORE_BASE64'].split()), validate=True))
              except ValueError:
                  raise SystemExit('KEYSTORE_BASE64 is not valid base64.') from None

              # Java Properties accepts Unicode escapes. Encode every UTF-16 unit
              # so spaces, backslashes and punctuation in secrets remain literal.
              def escape(value):
                  raw = value.encode('utf-16-be')
                  return ''.join('\\u%04x' % int.from_bytes(raw[i:i+2], 'big')
                                 for i in range(0, len(raw), 2))

              properties = {
                  'storeFile': str(keystore),
                  'storePassword': os.environ['STORE_PASSWORD'],
                  'keyPassword': os.environ['KEY_PASSWORD'],
                  'keyAlias': os.environ['KEY_ALIAS'],
              }
              Path('android/key.properties').write_text(''.join(
                  key + '=' + escape(value) + '\n' for key, value in properties.items()))
              mode = 'release-signed'
          else:
              raise SystemExit(
                  'Stable release signing is required. Configure the persistent signing key '
                  'for the chosen update baseline; CI will not generate a replacement '
                  'or publish an ephemeral TestSigned APK. A new key cannot update an old app.')

          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('mode=' + mode + '\n')
              output.write('label=ReleaseSigned' + '\n')
          PY

      - name: Build release APKs
        # Flutter 3.38 needs its pub phase to regenerate release-only plugin
        # registration after tests; --no-pub retains integration_test references.
        run: flutter build apk --release --split-per-abi
      - name: Verify every native library, ABI and APK ZIP alignment
        run: |
          set -euo pipefail
          python ../tool/verify_native_bundle.py android build/app/outputs/flutter-apk
          sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          zipalign="$(find "$sdk_root/build-tools" -name zipalign -type f | sort -V | tail -n 1)"
          test -x "$zipalign"
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            "$zipalign" -c -P 16 4 "$apk"
          done

      - name: Verify APK signatures and prepare artifacts
        env:
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
          SIGNING_LABEL: ${{ steps.signing.outputs.label }}
          APP_VERSION: ${{ steps.metadata.outputs.artifact_version }}
          PACKAGE_VERSION: ${{ steps.metadata.outputs.package_version }}
          VERSION_NAME: ${{ steps.metadata.outputs.version }}
          BUILD_NUMBER: ${{ steps.metadata.outputs.build_number }}
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          apksigner="$(find "$sdk_root/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$apksigner"
          aapt2="$(dirname "$apksigner")/aapt2"
          test -x "$aapt2"
          mkdir -p build/apk-artifacts
          for abi in arm64-v8a armeabi-v7a x86_64; do
            apk="build/app/outputs/flutter-apk/app-${abi}-release.apk"
            test -s "$apk"
            "$apksigner" verify --print-certs "$apk" > "build/apk-artifacts/${abi}-SIGNING-CERT.txt"
            python ../tool/verify_apk_signer.py main "build/apk-artifacts/${abi}-SIGNING-CERT.txt"
            case "$abi" in
              arm64-v8a) arch=arm64; offset=2000 ;;
              armeabi-v7a) arch=arm32; offset=1000 ;;
              x86_64) arch=x64; offset=4000 ;;
            esac
            badging="$("$aapt2" dump badging "$apk")"
            actual_package="$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" <<< "$badging")"
            actual_name="$(sed -n "s/^package:.* versionName='\([^']*\)'.*/\1/p" <<< "$badging")"
            actual_code="$(sed -n "s/^package:.* versionCode='\([^']*\)'.*/\1/p" <<< "$badging")"
            expected_code=$((BUILD_NUMBER + offset))
            if [[ "$actual_package" != "com.xycz.simple_live" || "$actual_name" != "$VERSION_NAME" || "$actual_code" != "$expected_code" ]]; then
              echo "::error::$abi APK version $actual_name+$actual_code does not match source $PACKAGE_VERSION (expected ABI code $expected_code)"
              exit 1
            fi
            printf 'Source: %s\nAPK: %s+%s\n' "$PACKAGE_VERSION" "$actual_name" "$actual_code" > "build/apk-artifacts/${abi}-VERSION.txt"
            cp "$apk" "build/apk-artifacts/Simple-Live-${APP_VERSION}-Android-${arch}-${SIGNING_LABEL}.apk"
          done
          cp pubspec.lock build/apk-artifacts/pubspec.lock
          flutter --version > build/apk-artifacts/FLUTTER-VERSION.txt
          cd build/apk-artifacts
          sha256sum *.apk > SHA256SUMS.txt
          sha256sum "Simple-Live-${APP_VERSION}-Android-arm64-${SIGNING_LABEL}.apk" > arm64-SHA256SUMS.txt
          printf '%s\n' \
            "Source version: $PACKAGE_VERSION" \
            "Artifact version: $APP_VERSION" \
            "Commit: $GITHUB_SHA" \
            "Signing: $SIGNING_MODE" \
            'Build mode: release' \
            'Package: com.xycz.simple_live' \
            'In-place updates require the same application ID, signing identity and ABI, with a higher version code.' \
            'Keep the existing app and data until you explicitly choose a migration; no uninstall is automatic.' \
            'Main app: export follows separately from settings; settings export does not include follows.' \
            'Verify both backups outside the app before any user-chosen uninstall; uninstall deletes local data.' \
            'The configured key must match the installed app; CI cannot recover a lost historical private key.' \
            > BUILD-INFO.txt
          cat FLUTTER-VERSION.txt >> BUILD-INFO.txt

      - name: Upload arm64 APK
        id: upload_arm64
        uses: actions/upload-artifact@v7
        with:
          path: simple_live_app/build/apk-artifacts/Simple-Live-${{ steps.metadata.outputs.artifact_version }}-Android-arm64-${{ steps.signing.outputs.label }}.apk
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload arm32 APK
        id: upload_arm32
        uses: actions/upload-artifact@v7
        with:
          path: simple_live_app/build/apk-artifacts/Simple-Live-${{ steps.metadata.outputs.artifact_version }}-Android-arm32-${{ steps.signing.outputs.label }}.apk
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload x64 APK
        id: upload_x64
        uses: actions/upload-artifact@v7
        with:
          path: simple_live_app/build/apk-artifacts/Simple-Live-${{ steps.metadata.outputs.artifact_version }}-Android-x64-${{ steps.signing.outputs.label }}.apk
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Summarize APK downloads
        env:
          ARM64_URL: ${{ steps.upload_arm64.outputs.artifact-url }}
          ARM32_URL: ${{ steps.upload_arm32.outputs.artifact-url }}
          X64_URL: ${{ steps.upload_x64.outputs.artifact-url }}
        run: |
          {
            printf '[Download arm64 APK](%s) · [Download arm32 APK](%s) · [Download x64 APK](%s)\n\n' "$ARM64_URL" "$ARM32_URL" "$X64_URL"
            printf '%s\n' 'Sign in to GitHub and download the APK matching your device; no outer ZIP extraction is needed.' ''
            cat build/apk-artifacts/BUILD-INFO.txt
            printf '\nSHA-256 checksums:\n'
            cat build/apk-artifacts/SHA256SUMS.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary release signing files
        if: always()
        run: |
          rm -f android/key.properties "$RUNNER_TEMP/simple-live-release.jks"

  tv-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
