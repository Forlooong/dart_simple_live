            actual_code="$(sed -n "s/^package:.* versionCode='\([^']*\)'.*/\1/p" <<< "$badging")"
            expected_code=$((BUILD_NUMBER + offset))
            if [[ "$actual_package" != "com.xycz.simple_live_tv" || "$actual_name" != "$VERSION_NAME" || "$actual_code" != "$expected_code" ]]; then
              echo "::error::$abi APK version $actual_name+$actual_code does not match source $PACKAGE_VERSION (expected ABI code $expected_code)"
              exit 1
            fi
            printf 'Source: %s\nAPK: %s+%s\n' "$PACKAGE_VERSION" "$actual_name" "$actual_code" > "build/apk-artifacts/${abi}-VERSION.txt"
            cp "$apk" "build/apk-artifacts/Simple-Live-${APP_VERSION}-Android-TV-${arch}-${SIGNING_LABEL}.apk"
