      - name: Set up Rust native targets
        uses: ./.github/actions/setup-native
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - name: Build console with native asset bundle
        working-directory: simple_live_console
        run: |
          dart pub get --enforce-lockfile
          dart build cli --target bin/simple_live_console.dart --output build/cli
          python ../tool/verify_native_bundle.py cli build/cli
      - name: Restore locked packages
        run: flutter pub get --enforce-lockfile
      - uses: ./.github/actions/check-native
      - name: Configure macOS release
        run: flutter build macos --release --no-pub --config-only
      - name: Build unsigned universal macOS app
        run: |
          xcodebuild -workspace macos/Runner.xcworkspace -scheme Runner \
            -configuration Release -derivedDataPath "$PWD/build/macos" \
            -destination 'generic/platform=macOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= \
            ARCHS='arm64 x86_64' ONLY_ACTIVE_ARCH=NO \
            COMPILER_INDEX_STORE_ENABLE=NO -quiet
      - name: Verify both native library architectures
        run: python ../tool/verify_native_bundle.py macos "build/macos/Build/Products/Release/Simple Live.app"
      - name: Verify Apple package version and identity
        env:
          PACKAGE_VERSION: ${{ steps.metadata.outputs.package_version }}
        run: python ../tool/verify_installer_identity.py macos "build/macos/Build/Products/Release/Simple Live.app" "$PACKAGE_VERSION"
      - name: Package macOS app
        env:
          APP_VERSION: ${{ steps.metadata.outputs.artifact_version }}
        run: |
          set -euo pipefail
          app='build/macos/Build/Products/Release/Simple Live.app'
          test -d "$app"
          lipo "$app/Contents/MacOS/Simple Live" -verify_arch arm64 x86_64
          mkdir -p build/artifacts
          mkdir -p build/dmg-root
          ditto "$app" 'build/dmg-root/Simple Live.app'
          ln -s /Applications build/dmg-root/Applications
          dmg="build/artifacts/Simple-Live-${APP_VERSION}-macOS-universal-Unsigned.dmg"
          hdiutil create -volname 'Simple Live' -srcfolder build/dmg-root -ov -format UDZO "$dmg"
          hdiutil verify "$dmg"
          mountpoint="$RUNNER_TEMP/simple-live-dmg"
          mkdir -p "$mountpoint"
          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mountpoint"
          trap 'hdiutil detach "$mountpoint"' EXIT
          python ../tool/verify_native_bundle.py macos "$mountpoint/Simple Live.app"
          test "$(readlink "$mountpoint/Applications")" = /Applications
          lipo "$mountpoint/Simple Live.app/Contents/MacOS/Simple Live" -verify_arch arm64 x86_64
          hdiutil detach "$mountpoint"
          trap - EXIT
          (cd build/artifacts && shasum -a 256 *.dmg > SHA256SUMS.txt)
          printf '%s\n' "macOS $APP_VERSION · arm64 + x64 · unsigned DMG" 'Open the DMG and drag Simple Live to Applications. Not notarized; macOS may prevent opening this build.' >> "$GITHUB_STEP_SUMMARY"
          cat build/artifacts/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload macOS package
        uses: actions/upload-artifact@v7
        with:
          name: Simple-Live-${{ steps.metadata.outputs.artifact_version }}-macOS-universal-Unsigned
          path: simple_live_app/build/artifacts/*.dmg
          archive: false
          if-no-files-found: error
          retention-days: 14

  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        working-directory: simple_live_app
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check version and prepare build identity
        id: metadata
        run: python ../tool/version.py metadata main
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true
      - name: Set up Rust native targets
        uses: ./.github/actions/setup-native
      - name: Build console with native asset bundle
        working-directory: simple_live_console
        run: |
          dart pub get --enforce-lockfile
          dart build cli --target bin/simple_live_console.dart --output build/cli
          python ../tool/verify_native_bundle.py cli build/cli
      - name: Restore locked packages
        run: flutter pub get --enforce-lockfile
      - uses: ./.github/actions/check-native
      - name: Build Windows release
        run: flutter build windows --release --no-pub
      - name: Load bundled native ABI
        run: python ../tool/verify_native_bundle.py windows build/windows/x64/runner/Release
      - name: Package and verify Windows installer
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.metadata.outputs.artifact_version }}
          VERSION_NAME: ${{ steps.metadata.outputs.version }}
          BUILD_NUMBER: ${{ steps.metadata.outputs.build_number }}
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = (Resolve-Path 'build/windows/x64/runner/Release').Path
          if (!(Test-Path "$bundle/simple_live_app.exe")) { throw 'Windows executable is missing' }
          $version = (Get-Item "$bundle/simple_live_app.exe").VersionInfo
          $actualVersion = "$($version.FileMajorPart).$($version.FileMinorPart).$($version.FileBuildPart).$($version.FilePrivatePart)"
          if ($actualVersion -ne "$env:VERSION_NAME.$env:BUILD_NUMBER") { throw "Executable version mismatch: $actualVersion" }
          $compiler = "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe"
          if (!(Test-Path $compiler)) { throw 'Preinstalled Inno Setup compiler is missing' }
          New-Item -ItemType Directory -Force build/artifacts | Out-Null
          $output = (Resolve-Path 'build/artifacts').Path
          $basename = "Simple-Live-$env:APP_VERSION-Windows-x64-Setup-Unsigned"
          $notice = Join-Path $output 'INSTALL-NOTES.txt'
          @(
            'Unsigned Simple Live installer. Windows may show an unknown-publisher warning.'
            'Requires Microsoft Visual C++ 2015-2022 Redistributable (x64).'
            'https://learn.microsoft.com/en-us/cpp/windows/latest-supported-vc-redist'
            'Installs for the current user. Existing application data is not removed.'
          ) | Set-Content -Encoding utf8 $notice
          @"
          [Setup]
          AppId=com.xycz.simplelive
          AppName=Simple Live
          AppVersion=$env:VERSION_NAME
          DefaultDirName={localappdata}\Programs\Simple Live
          DefaultGroupName=Simple Live
          UsePreviousAppDir=yes
          CloseApplications=yes
          PrivilegesRequired=lowest
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          OutputDir=$output
          OutputBaseFilename=$basename
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          UninstallDisplayIcon={app}\simple_live_app.exe
          InfoBeforeFile=$notice
          [Files]
          Source: "$bundle\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs
          [Icons]
          Name: "{group}\Simple Live"; Filename: "{app}\simple_live_app.exe"; WorkingDir: "{app}"
          "@ | Set-Content -Encoding utf8 build/installer.iss
          & $compiler build/installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compilation failed' }
          $installer = Join-Path $output "$basename.exe"
          if (!(Test-Path $installer)) { throw 'Installer is missing' }
          $installed = Join-Path $env:RUNNER_TEMP 'simple-live-installer-check'
          $process = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=`"$installed`"") -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Installer exited $($process.ExitCode)" }
          # A second install must discover the existing location without /DIR,
          # restore replaced application files and preserve unrelated user data.
          $sentinel = Join-Path $installed 'upgrade-data-sentinel.txt'
          'preserve-existing-data' | Set-Content -Encoding utf8 $sentinel
          Remove-Item (Join-Path $installed 'simple_live_app.exe')
          $upgrade = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-') -PassThru -Wait
          if ($upgrade.ExitCode -ne 0) { throw "Upgrade install exited $($upgrade.ExitCode)" }
          if ((Get-Content -Raw $sentinel).Trim() -ne 'preserve-existing-data') { throw 'Upgrade removed existing data' }
          Get-ChildItem $bundle -Recurse -File | ForEach-Object {
            $relative = [IO.Path]::GetRelativePath($bundle, $_.FullName)
            $copy = Join-Path $installed $relative
            if (!(Test-Path $copy) -or (Get-FileHash $_.FullName).Hash -ne (Get-FileHash $copy).Hash) {
              throw "Installed bundle differs: $relative"
            }
          }
          python ../tool/verify_native_bundle.py windows "$installed"
          if ($LASTEXITCODE -ne 0) { throw 'Installed native bundle verification failed' }
          $hash = Get-FileHash $installer -Algorithm SHA256
          "Windows $env:APP_VERSION · x64 · unsigned installer EXE. Requires Microsoft Visual C++ x64 runtime." >> $env:GITHUB_STEP_SUMMARY
          "$($hash.Hash.ToLower())  $basename.exe" >> $env:GITHUB_STEP_SUMMARY
      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: Simple-Live-${{ steps.metadata.outputs.artifact_version }}-Windows-x64-Unsigned
          path: simple_live_app/build/artifacts/*.exe
          archive: false
          if-no-files-found: error
          retention-days: 14

  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: simple_live_app
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check version and prepare build identity
        id: metadata
        run: python ../tool/version.py metadata main
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true
      - name: Set up Rust native targets
        uses: ./.github/actions/setup-native
      - name: Build console with native asset bundle
        working-directory: simple_live_console
        run: |
          dart pub get --enforce-lockfile
          dart build cli --target bin/simple_live_console.dart --output build/cli
          python ../tool/verify_native_bundle.py cli build/cli
      - name: Restore locked packages
        run: flutter pub get --enforce-lockfile
      - uses: ./.github/actions/check-native
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libasound2-dev libmpv-dev mpv
      - name: Build Linux release
        run: flutter build linux --release --no-pub
      - name: Load bundled native ABI
        run: python ../tool/verify_native_bundle.py linux build/linux/x64/release/bundle
      - name: Package and verify Linux DEB
        env:
          APP_VERSION: ${{ steps.metadata.outputs.artifact_version }}
          PACKAGE_VERSION: ${{ steps.metadata.outputs.package_version }}
        run: |
          set -euo pipefail
          bundle=build/linux/x64/release/bundle
          test -x "$bundle/simple_live_app"
          root=build/deb-root
          mkdir -p "$root/DEBIAN" "$root/opt/simple-live" "$root/usr/bin" \
            "$root/usr/share/applications" "$root/usr/share/icons/hicolor/256x256/apps" build/artifacts
          cp -a "$bundle/." "$root/opt/simple-live/"
          install -m 644 macos/Runner/Assets.xcassets/AppIcon.appiconset/icon-256.png "$root/usr/share/icons/hicolor/256x256/apps/com.xycz.simple_live_app.png"
          cat > "$root/usr/bin/simple-live" <<'EOF'
          #!/bin/sh
          exec /opt/simple-live/simple_live_app "$@"
          EOF
          chmod 755 "$root/usr/bin/simple-live"
          cat > "$root/usr/share/applications/com.xycz.simple_live_app.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Simple Live
          Comment=Live stream player
          Exec=simple-live
          Icon=com.xycz.simple_live_app
          Terminal=false
          Categories=AudioVideo;Player;
          StartupNotify=true
          EOF
          installed_size="$(du -sk "$root/opt" "$root/usr" | awk '{sum += $1} END {print sum}')"
          cat > "$root/DEBIAN/control" <<EOF
          Package: simple-live
          Version: $PACKAGE_VERSION
          Section: video
          Priority: optional
          Architecture: amd64
          Maintainer: xiaoyaocz <xiaoyaocz@52uwp.com>
          Installed-Size: $installed_size
          Depends: libc6 (>= 2.35), libstdc++6, libgtk-3-0, libmpv1, libasound2
          Description: Simple Live desktop live stream player
           Includes the complete Flutter application and bundled native libraries.
          EOF
          find "$root" -type d -exec chmod 755 {} +
          deb="build/artifacts/Simple-Live-${APP_VERSION}-Linux-x64.deb"
          dpkg-deb --build --root-owner-group "$root" "$deb"
          dpkg-deb --info "$deb"
          test "$(dpkg-deb -f "$deb" Package)" = simple-live
          test "$(dpkg-deb -f "$deb" Version)" = "$PACKAGE_VERSION"
          test "$(dpkg-deb -f "$deb" Architecture)" = amd64
          extracted=build/deb-verified
          dpkg-deb --extract "$deb" "$extracted"
          diff -r "$bundle" "$extracted/opt/simple-live"
          test -x "$extracted/usr/bin/simple-live"
          test -f "$extracted/usr/share/applications/com.xycz.simple_live_app.desktop"
          python ../tool/verify_native_bundle.py linux "$extracted/opt/simple-live"
          while IFS= read -r -d '' binary; do
            if file -b "$binary" | grep -q '^ELF'; then
              dependencies="$(LD_LIBRARY_PATH="$PWD/$extracted/opt/simple-live/lib" ldd "$binary")"
              printf '%s\n%s\n' "$binary" "$dependencies"
              if grep -q 'not found' <<< "$dependencies"; then
                echo "::error::Unresolved Linux runtime dependency in $binary"
                exit 1
              fi
            fi
          done < <(find "$extracted/opt/simple-live" -type f -print0)
          (cd build/artifacts && sha256sum *.deb > SHA256SUMS.txt)
          printf '%s\n' "Linux $APP_VERSION · amd64 · DEB" 'For Ubuntu 22.04 or compatible distributions with libmpv1. Install using sudo apt install ./Simple-Live-*.deb so dependencies are resolved.' >> "$GITHUB_STEP_SUMMARY"
          cat build/artifacts/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Linux package
        uses: actions/upload-artifact@v7
        with:
          name: Simple-Live-${{ steps.metadata.outputs.artifact_version }}-Linux-x64-Release
          path: simple_live_app/build/artifacts/*.deb
          archive: false
          if-no-files-found: error
          retention-days: 14
