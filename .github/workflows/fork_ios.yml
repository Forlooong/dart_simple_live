name: app-build-action-ios
run-name: "Release iOS · 1.12.9+11110 · #${{ github.run_number }}"

on:
  workflow_dispatch:
  push:
    branches: [master, fix/known-issues-release]
    paths:
      - 'simple_live_app/**'
      - 'simple_live_core/**'
      - 'packages/**'
      - '.github/actions/**'
      - 'tool/**'
      - '.github/workflows/fork_ios.yml'

permissions:
  contents: read

concurrency:
  group: fork-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    env:
      # connectivity_plus uses APIs introduced in the Apple 26 SDKs.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    timeout-minutes: 60
    defaults:
      run:
        working-directory: simple_live_app
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check version and prepare build identity
        id: metadata
        run: python ../tool/version.py metadata main
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true
      - name: Set up Rust native targets
        uses: ./.github/actions/setup-native
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - name: Restore locked packages
        run: flutter pub get --enforce-lockfile
      - uses: ./.github/actions/check-native
      - name: Test native assets on iOS simulator
        run: python ../tool/test_ios_native.py
      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign --no-pub
      - name: Verify device native libraries
        run: python ../tool/verify_native_bundle.py ios build/ios/iphoneos/Runner.app
      - name: Package unsigned IPA
        env:
          APP_VERSION: ${{ steps.metadata.outputs.artifact_version }}
        run: |
          set -euo pipefail
          test -d build/ios/iphoneos/Runner.app
          mkdir -p build/ipa/Payload build/artifacts
          ditto build/ios/iphoneos/Runner.app build/ipa/Payload/Runner.app
          (cd build/ipa && zip -qry "../artifacts/Simple-Live-${APP_VERSION}-iOS-arm64-Unsigned.ipa" Payload)
          unzip -t build/artifacts/*.ipa
          (cd build/artifacts && shasum -a 256 *.ipa > SHA256SUMS.txt)
          printf '%s\n' "iOS $APP_VERSION · arm64 · unsigned IPA" 'Requires signing with an Apple development/distribution identity before installation.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload iOS package
        uses: actions/upload-artifact@v7
        with:
          name: Simple-Live-${{ steps.metadata.outputs.artifact_version }}-iOS-arm64-Unsigned
          path: simple_live_app/build/artifacts/
          if-no-files-found: error
          retention-days: 14
