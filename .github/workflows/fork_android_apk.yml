name: app-build-action-android
run-name: "Release Android · 1.12.3"

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: simple_live_app
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true
      - name: Prepare readable build names
        id: metadata
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version: *\([^ ]*\).*$/\1/p' pubspec.yaml | tr -d '\r')"
          package_version="$version"
          [[ "$package_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$ ]]
          version="${package_version%%+*}"
          # GitHub evaluates run-name before checkout. Fail if a version bump
          # forgot to update this workflow's static, version-only title.
          expected_title="Release Android · $version"
          actual_title="$(sed -n 's/^run-name: "\(.*\)"$/\1/p' ../.github/workflows/fork_android_apk.yml)"
          if [[ "$actual_title" != "$expected_title" ]]; then
            echo "::error::Update run-name to $expected_title to match pubspec.yaml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          {
            printf '## Build identity\n\n'
            printf -- '- Package version: `%s`\n' "$package_version"
            printf -- '- CI build: `%s.%s`\n' "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_ATTEMPT"
            printf -- '- Commit: `%s`\n\n' "$GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Restore packages
        run: flutter pub get --enforce-lockfile

      - name: Check player and notification code
        run: |
          flutter analyze --no-pub --no-fatal-infos \
            lib/modules/live_room/live_room_controller.dart \
            lib/modules/live_room/player/player_controller.dart \
            lib/modules/live_room/player/player_command_queue.dart \
            lib/routes/app_navigation.dart \
            lib/services/live_notification_service.dart \
            lib/services/live_notifications \
            lib/services/follow_import.dart \
            lib/main.dart \
            lib/models/db/follow_user.dart \
            lib/modules/follow_user \
            lib/widgets/follow_user_item.dart

      - name: Test player lifecycle and live notifications
        run: >-
          flutter test --no-pub
          test/player_command_queue_test.dart
          test/live_room_lifecycle_test.dart
          test/live_playback_recovery_test.dart
          test/danmaku_lifecycle_test.dart
          test/follow_notification_preferences_test.dart
          test/live_status_validation_test.dart
          test/live_notification_runner_test.dart
          test/notification_navigation_test.dart
          test/live_notification_service_test.dart

      - name: Configure APK signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          names = ('KEYSTORE_BASE64', 'STORE_PASSWORD', 'KEY_PASSWORD', 'KEY_ALIAS')
          present = [bool(os.environ.get(name)) for name in names]
          if any(present) and not all(present):
              raise SystemExit('Release signing secrets are incomplete; refusing to fall back silently.')

          if all(present):
              os.umask(0o077)
              keystore = Path(os.environ['RUNNER_TEMP']) / 'simple-live-release.jks'
              try:
                  keystore.write_bytes(base64.b64decode(
                      ''.join(os.environ['KEYSTORE_BASE64'].split()), validate=True))
              except ValueError:
                  raise SystemExit('KEYSTORE_BASE64 is not valid base64.') from None

              # Java Properties accepts Unicode escapes. Encode every UTF-16 unit
              # so spaces, backslashes and punctuation in secrets remain literal.
              def escape(value):
                  raw = value.encode('utf-16-be')
                  return ''.join('\\u%04x' % int.from_bytes(raw[i:i+2], 'big')
                                 for i in range(0, len(raw), 2))

              properties = {
                  'storeFile': str(keystore),
                  'storePassword': os.environ['STORE_PASSWORD'],
                  'keyPassword': os.environ['KEY_PASSWORD'],
                  'keyAlias': os.environ['KEY_ALIAS'],
              }
              Path('android/key.properties').write_text(''.join(
                  key + '=' + escape(value) + '\n' for key, value in properties.items()))
              mode = 'release-signed'
          else:
              # Intentional fork-only fallback: optimized release APK, test key.
              with open(os.environ['GITHUB_ENV'], 'a') as output:
                  output.write('ORG_GRADLE_PROJECT_allowDebugReleaseSigning=true\n')
              mode = 'debug-signed-test-only'

          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('mode=' + mode + '\n')
              output.write('label=' + ('ReleaseSigned' if mode == 'release-signed' else 'TestSigned') + '\n')
          PY

      - name: Build release APKs
        run: flutter build apk --release --split-per-abi --no-pub

      - name: Verify APK signatures and prepare artifacts
        env:
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
          SIGNING_LABEL: ${{ steps.signing.outputs.label }}
          APP_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          apksigner="$(find "$sdk_root/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$apksigner"
          mkdir -p build/apk-artifacts
          for abi in arm64-v8a armeabi-v7a x86_64; do
            apk="build/app/outputs/flutter-apk/app-${abi}-release.apk"
            test -s "$apk"
            "$apksigner" verify --print-certs "$apk" > "build/apk-artifacts/${abi}-SIGNING-CERT.txt"
            case "$abi" in
              arm64-v8a) arch=arm64 ;;
              armeabi-v7a) arch=arm32 ;;
              x86_64) arch=x64 ;;
            esac
            cp "$apk" "build/apk-artifacts/Simple-Live-${APP_VERSION}-Android-${arch}-${SIGNING_LABEL}.apk"
          done
          cp pubspec.lock build/apk-artifacts/pubspec.lock
          flutter --version > build/apk-artifacts/FLUTTER-VERSION.txt
          cd build/apk-artifacts
          sha256sum *.apk > SHA256SUMS.txt
          sha256sum "Simple-Live-${APP_VERSION}-Android-arm64-${SIGNING_LABEL}.apk" > arm64-SHA256SUMS.txt
          printf '%s\n' \
            "Commit: $GITHUB_SHA" \
            "Signing: $SIGNING_MODE" \
            'Build mode: release' \
            'Package: com.xycz.simple_live' \
            'A debug-signed APK cannot update an app signed with another key.' \
            'Export settings before uninstalling any existing app; uninstalling deletes its local data.' \
            'Debug signing keys on fresh CI runners can change between runs.' \
            > BUILD-INFO.txt
          cat FLUTTER-VERSION.txt >> BUILD-INFO.txt

      - name: Upload installable APKs
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: Simple-Live-${{ steps.metadata.outputs.version }}-Android-Release-${{ steps.signing.outputs.label }}
          path: simple_live_app/build/apk-artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Upload arm64 APK
        id: upload_arm64
        uses: actions/upload-artifact@v7
        with:
          name: Simple-Live-${{ steps.metadata.outputs.version }}-Android-arm64-${{ steps.signing.outputs.label }}
          path: |
            simple_live_app/build/apk-artifacts/Simple-Live-${{ steps.metadata.outputs.version }}-Android-arm64-${{ steps.signing.outputs.label }}.apk
            simple_live_app/build/apk-artifacts/arm64-SHA256SUMS.txt
            simple_live_app/build/apk-artifacts/arm64-v8a-SIGNING-CERT.txt
            simple_live_app/build/apk-artifacts/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 14

      - name: Summarize Android download
        env:
          APP_VERSION: ${{ steps.metadata.outputs.version }}
          SIGNING_LABEL: ${{ steps.signing.outputs.label }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          ARM64_ARTIFACT_URL: ${{ steps.upload_arm64.outputs.artifact-url }}
        run: |
          {
            printf '## Simple Live %s · Android\n\n' "$APP_VERSION"
            printf '[Download arm64 APK](%s) (%s, ZIP archive for arm64-v8a devices).\n\n' "$ARM64_ARTIFACT_URL" "$SIGNING_LABEL"
            printf '[Download all APKs](%s) (%s). Sign in to GitHub, download and unzip the artifact, then install one APK matching your device.\n\n' "$ARTIFACT_URL" "$SIGNING_LABEL"
            printf '%s\n' \
              '- arm64: 64-bit ARM devices (arm64-v8a).' \
              '- arm32: 32-bit ARM devices (armeabi-v7a).' \
              '- x64: 64-bit Intel/AMD devices or emulators (x86_64).' \
              '' \
              'TestSigned builds use a test key that may change between runs. Updating an installed app requires the same signing key; back up or export settings before uninstalling, because uninstalling removes local data.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary release signing files
        if: always()
        run: |
          rm -f android/key.properties "$RUNNER_TEMP/simple-live-release.jks"
