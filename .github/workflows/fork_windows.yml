name: app-build-action-windows
run-name: "Release Windows · build #${{ github.run_number }}.${{ github.run_attempt }} · ${{ github.ref_name }}"

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'simple_live_app/**'
      - 'simple_live_core/**'
      - '.github/workflows/fork_windows.yml'

permissions:
  contents: read

concurrency:
  group: fork-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        working-directory: simple_live_app
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true
      - name: Read package version
        id: metadata
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version: *\([^ ]*\).*$/\1/p' pubspec.yaml | tr -d '\r')"
          test -n "$version"
          short_sha="${GITHUB_SHA:0:7}"
          build_suffix="build.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}-${short_sha}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build-suffix=$build_suffix" >> "$GITHUB_OUTPUT"
          {
            printf '## Build identity\n\n'
            printf -- '- Package version: `%s`\n' "$version"
            printf -- '- CI build: `%s.%s`\n' "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_ATTEMPT"
            printf -- '- Commit: `%s`\n\n' "$GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Restore locked packages
        run: flutter pub get --enforce-lockfile
      - name: Build Windows release
        run: flutter build windows --release --no-pub
      - name: Package portable Windows app
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.metadata.outputs.version }}
          BUILD_SUFFIX: ${{ steps.metadata.outputs.build-suffix }}
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = 'build/windows/x64/runner/Release'
          if (!(Test-Path "$bundle/simple_live_app.exe")) { throw 'Windows executable is missing' }
          New-Item -ItemType Directory -Force build/artifacts | Out-Null
          $archive = "build/artifacts/Simple-Live-$env:APP_VERSION-$env:BUILD_SUFFIX-Windows-x64-Unsigned.zip"
          Compress-Archive -Path "$bundle/*" -DestinationPath $archive
          $hash = Get-FileHash $archive -Algorithm SHA256
          "$($hash.Hash.ToLower())  $([IO.Path]::GetFileName($archive))" | Set-Content build/artifacts/SHA256SUMS.txt
          @(
            "Commit: $env:GITHUB_SHA"
            'Unsigned portable Windows x64 build. Extract the entire archive before running.'
            'Requires Microsoft Visual C++ 2015-2022 Redistributable (x64).'
            'https://learn.microsoft.com/en-us/cpp/windows/latest-supported-vc-redist'
          ) | Set-Content build/artifacts/BUILD-INFO.txt
          "Windows $env:APP_VERSION · x64 · unsigned portable ZIP. Extract fully; requires Microsoft Visual C++ x64 runtime." >> $env:GITHUB_STEP_SUMMARY
      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: Simple-Live-${{ steps.metadata.outputs.version }}-Windows-x64-Unsigned-${{ steps.metadata.outputs.build-suffix }}
          path: simple_live_app/build/artifacts/
          if-no-files-found: error
          retention-days: 14
