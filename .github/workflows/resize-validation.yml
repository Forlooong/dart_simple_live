name: Windows resize comparison
on:
  push:
    branches: [codex/windows-resize-validation]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 35
    defaults:
      run:
        working-directory: simple_live_app
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - uses: ./.github/actions/setup-native
      - name: Build the portable Windows Release bundle from locked packages
        run: |
          Copy-Item -LiteralPath pubspec.windows.lock -Destination pubspec.lock -Force
          flutter pub get --enforce-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter build windows --release --no-pub
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../tool/verify_native_bundle.py windows build/windows/x64/runner/Release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Simple-Live-Windows-x64-Resize-Test
          path: simple_live_app/build/windows/x64/runner/Release/
          retention-days: 14
          if-no-files-found: error
      - name: Build the live playback resize harness
        run: flutter build windows --release --no-pub --target integration_test/windows_resize_live.dart
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Simple-Live-Windows-x64-Live-Probe
          path: simple_live_app/build/windows/x64/runner/Release/
          retention-days: 7
          if-no-files-found: error
      - name: Verify application chat and playback contracts
        run: flutter test --no-pub test/danmaku_lifecycle_test.dart test/live_playback_recovery_test.dart

