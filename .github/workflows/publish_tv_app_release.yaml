name: app-build-action
#推送Tag时触发
on:
  push:
    tags:
      - "tv_*"
jobs:
  build-tv:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      #签出代码
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate TV release identity before signing/building
        id: version
        run: python tool/release_metadata.py

      #APK签名设置
      - name: Download Android keystore
        id: android_tv_keystore
        uses: timheuer/base64-to-file@v1.2
        with:
          fileName: keystore.jks
          encodedString: ${{ secrets.TV_KEYSTORE_BASE64 }}
      - name: Create key.properties
        run: |
          echo "storeFile=${{ steps.android_tv_keystore.outputs.filePath }}" > simple_live_tv_app/android/key.properties
          echo "storePassword=${{ secrets.TV_STORE_PASSWORD }}" >> simple_live_tv_app/android/key.properties
          echo "keyPassword=${{ secrets.TV_KEY_PASSWORD }}" >> simple_live_tv_app/android/key.properties
          echo "keyAlias=${{ secrets.TV_KEY_ALIAS }}" >> simple_live_tv_app/android/key.properties

      # 设置JAVA环境
      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"

      #设置Flutter
      - name: Flutter action
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.10"
          cache: true
      - name: Set up Rust native targets
        uses: ./.github/actions/setup-native
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      #更新Flutter的packages
      - name: Restore packages
        run: |
          cd simple_live_tv_app
          flutter pub get --enforce-lockfile
      - uses: ./.github/actions/check-native

      #打包APK
      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd simple_live_tv_app
          flutter build apk --release --split-per-abi
          python ../tool/verify_native_bundle.py android build/app/outputs/flutter-apk
          sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          zipalign="$(python -c 'from pathlib import Path; import sys; print(max(Path(sys.argv[1]).glob("*/zipalign"), key=lambda p: tuple(int(x) for x in p.parent.name.split(".") if x.isdigit())))' "$sdk_root/build-tools")"
          test -x "$zipalign"
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            "$zipalign" -c -P 16 4 "$apk"
          done

      #上传APK至Artifacts
      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android_tv
          path: |
            simple_live_tv_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            simple_live_tv_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            simple_live_tv_app/build/app/outputs/flutter-apk/app-x86_64-release.apk

      #上传至Release
      - name: Upload Release
        uses: softprops/action-gh-release@v1
        with:
          name: "${{ steps.version.outputs.release_name }}"
          body: |
            Android TV ${{ steps.version.outputs.package_version }}
            Source: ${{ github.sha }}
            Draft prerelease. Review docs/release-gates.md before publication.
            Signing compatibility and on-device smoke tests must be established separately.
          draft: true
          prerelease: true
          token: ${{ secrets.TOKEN }}
          files: |
            simple_live_tv_app/build/app/outputs/flutter-apk/app-x86_64-release.apk
            simple_live_tv_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            simple_live_tv_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk

      #完成
      - run: echo "🍏 This job's status is ${{ job.status }}."
