[package]
name = "danmaku_native"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "GPL-3.0-only"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
aho-corasick = "1.1.3"
brotli = "8.0.2"
flate2 = { version = "1.1.2", default-features = false, features = ["rust_backend"] }
prost = "0.14.1"
regress = { path = "vendor/regress", default-features = false, features = ["std", "utf16"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[workspace]
members = ["."]
exclude = ["vendor/regress"]
